[package]
name = "stockholm"
version = "0.2.26"
authors = ["Stephan Boyer <stephan@stephanboyer.com>"]
edition = "2024"
description = "An algorithmic trading bot."
license = "MIT"
documentation = "https://github.com/stepchowfun/stockholm"
homepage = "https://github.com/stepchowfun/stockholm"
repository = "https://github.com/stepchowfun/stockholm"
readme = "README.md"

[lints]
clippy.all = { level = "deny", priority = -1 }
clippy.default_numeric_fallback = "deny"
clippy.pedantic = { level = "deny", priority = -1 }
rust.warnings = "deny"

[dependencies]
burn = { version = "0.21.0", default-features = false, features = ["autodiff", "dataset", "ndarray", "std"] }
clap = { version = "4.6.5", features = ["derive"] }
csv = "1.4.0"
dirs = "6.0.0"
ibapi = "3.3.0"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["parsing", "serde"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1.24.0", features = ["v4"] }
yaml_serde = "0.10.4"
